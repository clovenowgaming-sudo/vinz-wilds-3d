plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vinz.wilds'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vinz.wilds'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "VinzWilds-v${variant.versionName}.apk"
        }
    }
}
